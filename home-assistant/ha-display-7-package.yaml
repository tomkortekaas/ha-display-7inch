input_boolean:
  ha_display_deurbel_actief:
    name: "HA Display 7 deurbel actief"
    icon: mdi:doorbell-video
    initial: false

automation:
  # Reolink Voordeur entities uit Home Assistant:
  # - trigger: binary_sensor.voordeur_bezoeker
  # - snapshotbron: camera.voordeur_vloeiend
  - alias: "HA Display 7 - Deurbel tonen"
    id: ha_display_7_deurbel_tonen
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.voordeur_bezoeker
        to: "on"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.ha_display_deurbel_actief
      - repeat:
          count: 50
          sequence:
            - condition: state
              entity_id: input_boolean.ha_display_deurbel_actief
              state: "on"
            - action: camera.snapshot
              target:
                entity_id: camera.voordeur_vloeiend
              data:
                filename: /config/www/ha-display-doorbell.jpg
            - delay: "00:00:01"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.ha_display_deurbel_actief

  - alias: "HA Display 7 - Review badge count"
    id: ha_display_7_review_badge
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    action:
      - action: shell_command.immich_review_count

  - alias: "HA Display 7 - Buienradar frames verversen"
    id: ha_display_7_buienradar_frames_verversen
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/10"
    action:
      - action: shell_command.buienradar_update_7inch

  - alias: "HA Display 7 - Immich foto roteren"
    id: ha_display_7_immich_foto_roteren
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    action:
      - action: shell_command.immich_rotate_7inch

  # De HA-timer is bewust niet herstelbaar. Trek bij iedere Core-start daarom ook
  # de losse statushelper en de native iDot-countdown terug naar dezelfde idle-
  # toestand. Zet de alarm-automation tijdelijk uit zodat een eventueel lopende
  # gonglus eerst wordt afgebroken; een onbereikbare iDot mag het overige herstel
  # niet blokkeren.
  - alias: "iDotMatrix timer herstellen na HA-start"
    id: idotmatrix_timer_startup_reconcile
    mode: single
    trigger:
      - trigger: homeassistant
        event: start
    action:
      - action: automation.turn_off
        target:
          entity_id: automation.idotmatrix_timer_alarmgong
        data:
          stop_actions: true
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: idle
      - action: idotmatrix_extras.set_countdown
        continue_on_error: true
        data:
          mode: 0
          minutes: 0
          seconds: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.idotmatrix_timer_minuten
        data:
          value: 0
      - action: automation.turn_on
        target:
          entity_id: automation.idot_rotatie
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.idotmatrix_actief
      - action: automation.turn_on
        target:
          entity_id: automation.idotmatrix_timer_alarmgong

  - alias: "iDotMatrix timer afgelopen"
    id: idotmatrix_timer_finished
    mode: single
    trigger:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.idotmatrix_timer
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: alarming

  - alias: "iDotMatrix timer alarmgong"
    id: idotmatrix_timer_alarm
    mode: restart
    trigger:
      - trigger: state
        entity_id: input_select.idotmatrix_timer_status
        to: alarming
    action:
      - repeat:
          sequence:
            - condition: state
              entity_id: input_select.idotmatrix_timer_status
              state: alarming
            - action: reolink.play_chime
              continue_on_error: true
              target:
                device_id: 271cbe4bff5083fb97aabac7f63f9f66
              data:
                ringtone: goodday
            - delay: "00:00:03"
          while:
            - condition: state
              entity_id: input_select.idotmatrix_timer_status
              state: alarming
