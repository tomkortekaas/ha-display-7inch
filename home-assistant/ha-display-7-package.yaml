# Home Assistant package voor HA Display 7.
# Zet dit bestand bijvoorbeeld op:
#   /config/packages/ha-display-7.yaml
#
# En laad packages in /config/configuration.yaml met:
#
# homeassistant:
#   packages: !include_dir_named packages

# Buienradar-kaart voor het ESPHome weerscherm
# ------------------------------------------------------------
# Het display verwacht 9 lokale JPG frames:
#   /config/www/ha-display-radar/radar_0.jpg  -> nu
#   /config/www/ha-display-radar/radar_1.jpg  -> +15 min
#   ...
#   /config/www/ha-display-radar/radar_8.jpg  -> +120 min
#
# Deze zijn via Home Assistant bereikbaar als:
#   /local/ha-display-radar/radar_0.jpg ... radar_8.jpg
#
# De Buienradar integratie is aanwezig. De entity registry bevat
# camera.buienradar, maar die staat standaard disabled_by=integration.
# Schakel deze camera in via Settings > Devices & services > Entities
# als je een actuele Buienradar still als bron of fallback wilt gebruiken.
# De bewegende 2-uurs radar gebruikt de lokale framebestanden hierboven.

rest:
  - resource: !secret photo_swipe_today_url
    scan_interval: 300
    sensor:
      - name: "Immich review vandaag count"
        unique_id: immich_review_vandaag_count
        value_template: "{{ value_json.count | int(0) }}"
        unit_of_measurement: "foto's"
        icon: "mdi:image-check"

input_select:
  idotmatrix_timer_status:
    name: iDotMatrix timer status
    options: [idle, running, paused, alarming]
    initial: idle

input_number:
  idotmatrix_timer_minuten:
    name: iDotMatrix timer minuten
    min: 0
    max: 99
    step: 1
    mode: box

timer:
  idotmatrix_timer:
    name: iDotMatrix timer
    duration: "00:05:00"
    restore: false

script:
  idotmatrix_timer_start:
    alias: "iDotMatrix timer starten"
    mode: single
    fields:
      minutes:
        name: Minuten
        description: Aantal hele minuten voor de keukentimer
        required: true
        selector:
          number:
            min: 0
            max: 99
            step: 1
            mode: box
      seconds:
        name: Seconden
        description: Aanvullende seconden voor de keukentimer
        required: false
        default: 0
        selector:
          number:
            min: 0
            max: 59
            step: 1
            mode: box
    sequence:
      - condition: template
        value_template: >-
          {% set raw_seconds = seconds if seconds is defined else 0 %}
          {{ minutes is defined
             and minutes is number
             and minutes is not boolean
             and minutes | float == minutes | int
             and raw_seconds is number
             and raw_seconds is not boolean
             and raw_seconds | float == raw_seconds | int }}
      - variables:
          timer_minutes: "{{ minutes | int(0) }}"
          timer_seconds: "{{ seconds | default(0, true) | int(0) }}"
      - variables:
          total_seconds: "{{ timer_minutes * 60 + timer_seconds }}"
      - condition: template
        value_template: >-
          {{ 1 <= total_seconds <= 5999
             and minutes | float(0) == timer_minutes
             and seconds | default(0, true) | float(0) == timer_seconds }}
      - condition: state
        entity_id: input_select.idotmatrix_timer_status
        state: idle
      - variables:
          normalized_minutes: "{{ (total_seconds | int(0)) // 60 }}"
          normalized_seconds: "{{ (total_seconds | int(0)) % 60 }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.idotmatrix_actief
      - action: idotmatrix.set_face
        data:
          face:
            layers: []
      - delay: "00:00:01"
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 1
          minutes: "{{ normalized_minutes }}"
          seconds: "{{ normalized_seconds }}"
      - action: timer.start
        target:
          entity_id: timer.idotmatrix_timer
        data:
          duration: >-
            {{ '%02d:%02d:%02d' | format(
                 (total_seconds | int(0)) // 3600,
                 ((total_seconds | int(0)) % 3600) // 60,
                 (total_seconds | int(0)) % 60) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.idotmatrix_timer_minuten
        data:
          value: "{{ normalized_minutes }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: running

  idotmatrix_timer_pause:
    alias: "iDotMatrix timer pauzeren"
    mode: single
    sequence:
      - condition: state
        entity_id: input_select.idotmatrix_timer_status
        state: running
      - action: timer.pause
        target:
          entity_id: timer.idotmatrix_timer
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 2
          minutes: 0
          seconds: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: paused

  idotmatrix_timer_resume:
    alias: "iDotMatrix timer hervatten"
    mode: single
    sequence:
      - condition: state
        entity_id: input_select.idotmatrix_timer_status
        state: paused
      - variables:
          remaining: >-
            {{ state_attr('timer.idotmatrix_timer', 'remaining')
               | default('00:00:00', true) | string }}
      - variables:
          remaining_parts: "{{ remaining.split(':') }}"
          remaining_seconds: >-
            {{ (remaining_parts[0] | int(0)) * 3600
               + (remaining_parts[1] | int(0)) * 60
               + (remaining_parts[2] | float(0) | int) }}
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 3
          minutes: "{{ (remaining_seconds | int(0)) // 60 }}"
          seconds: "{{ (remaining_seconds | int(0)) % 60 }}"
      - action: timer.start
        target:
          entity_id: timer.idotmatrix_timer
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: running

  idotmatrix_timer_add_minute:
    alias: "iDotMatrix timer één minuut verlengen"
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_select.idotmatrix_timer_status') in ['running', 'paused'] }}
      - variables:
          original_status: "{{ states('input_select.idotmatrix_timer_status') }}"
          remaining: >-
            {{ state_attr('timer.idotmatrix_timer', 'remaining')
               | default('00:00:00', true) | string }}
      - variables:
          remaining_parts: "{{ remaining.split(':') }}"
          remaining_seconds: >-
            {% if original_status == 'running' %}
              {{ [((as_timestamp(state_attr('timer.idotmatrix_timer', 'finishes_at'), 0)
                    - as_timestamp(now())) | round(0, 'ceil') | int(0)), 0] | max }}
            {% else %}
              {{ (remaining_parts[0] | int(0)) * 3600
                 + (remaining_parts[1] | int(0)) * 60
                 + (remaining_parts[2] | float(0) | int) }}
            {% endif %}
      - variables:
          new_remaining_seconds: "{{ [(remaining_seconds | int(0)) + 60, 5999] | min }}"
      - action: timer.start
        target:
          entity_id: timer.idotmatrix_timer
        data:
          duration: >-
            {{ '%02d:%02d:%02d' | format(
                 (new_remaining_seconds | int(0)) // 3600,
                 ((new_remaining_seconds | int(0)) % 3600) // 60,
                 (new_remaining_seconds | int(0)) % 60) }}
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 1
          minutes: "{{ (new_remaining_seconds | int(0)) // 60 }}"
          seconds: "{{ (new_remaining_seconds | int(0)) % 60 }}"
      - if:
          - condition: template
            value_template: "{{ original_status == 'paused' }}"
        then:
          - action: timer.pause
            target:
              entity_id: timer.idotmatrix_timer
          - action: idotmatrix_extras.set_countdown
            data:
              mode: 2
              minutes: 0
              seconds: 0
          - action: input_select.select_option
            target:
              entity_id: input_select.idotmatrix_timer_status
            data:
              option: paused

  idotmatrix_timer_stop:
    alias: "iDotMatrix timer stoppen"
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_select.idotmatrix_timer_status') in ['running', 'paused'] }}
      - action: timer.cancel
        target:
          entity_id: timer.idotmatrix_timer
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 0
          minutes: 0
          seconds: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.idotmatrix_timer_minuten
        data:
          value: 0
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: idle
      - action: automation.turn_on
        target:
          entity_id: automation.idot_rotatie
      - delay:
          milliseconds: 1500
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.idotmatrix_actief

  idotmatrix_timer_acknowledge:
    alias: "iDotMatrix timeralarm uitzetten"
    mode: single
    sequence:
      - condition: state
        entity_id: input_select.idotmatrix_timer_status
        state: alarming
      - action: input_select.select_option
        target:
          entity_id: input_select.idotmatrix_timer_status
        data:
          option: idle
      - action: idotmatrix_extras.set_countdown
        data:
          mode: 0
          minutes: 0
          seconds: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.idotmatrix_timer_minuten
        data:
          value: 0
      - action: automation.turn_on
        target:
          entity_id: automation.idot_rotatie
      - delay:
          milliseconds: 1500
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.idotmatrix_actief

template:
  # Familie-agenda voor het 7" display.
  # Voeg in Home Assistant eerst de Remote Calendar integratie toe met deze ICS:
  # https://calendar.google.com/calendar/ical/rrb72ssis661svh204h0c9ovlk%40group.calendar.google.com/public/basic.ics
  # Verwachte entity_id na hernoemen: calendar.thuisagenda
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
    action:
      - action: calendar.get_events
        target:
          entity_id: calendar.thuisagenda
        data:
          start_date_time: "{{ today_at('00:00').strftime('%Y-%m-%d %H:%M:%S') }}"
          duration:
            hours: 168
        response_variable: familie_agenda
    sensor:
      - name: "Familie agenda d0 title"
        unique_id: familie_agenda_d0_title
        state: "Vandaag"
      - name: "Familie agenda d0 date"
        unique_id: familie_agenda_d0_date
        state: "{{ (now() + timedelta(days=0)).strftime('%d-%m') }}"
      - name: "Familie agenda d0 count"
        unique_id: familie_agenda_d0_count
        state: >
          {% set day = (now().date() + timedelta(days=0)).isoformat() %}
          {% set events = familie_agenda.get('calendar.thuisagenda', {}).get('events', []) %}
          {% set ns = namespace(count=0) %}
          {% for e in events %}
            {% if e.start[:10] == day %}{% set ns.count = ns.count + 1 %}{% endif %}
          {% endfor %}
          {% if ns.count == 0 %}geen afspraken{% elif ns.count == 1 %}1 afspraak{% else %}{{ ns.count }} afspraken{% endif %}
      - name: "Familie agenda d0 event 1"
        unique_id: familie_agenda_d0_event_1
        state: >
          {% set day = (now().date() + timedelta(days=0)).isoformat() %}
          {% set events = familie_agenda.get('calendar.thuisagenda', {}).get('events', []) %}
          {% set ns = namespace(rows=[]) %}
          {% for e in events %}
            {% if e.start[:10] == day %}
              {% set when = 'hele dag' if e.start|length == 10 else as_datetime(e.start).strftime('%H:%M') %}
              {% set ns.rows = ns.rows + [when ~ ' ' ~ e.summary] %}
            {% endif %}
          {% endfor %}
          {{ ns.rows[0] if ns.rows|length > 0 else '' }}
